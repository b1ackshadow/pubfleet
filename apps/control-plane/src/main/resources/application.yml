spring:
  application:
    name: pubfleet-control-plane

  # Java 25 platform threads are not the bottleneck here, but every request in this app
  # blocks on Postgres. Virtual threads let the container hold many of those cheaply.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${PUBFLEET_DB_URL:jdbc:postgresql://localhost:5432/pubfleet}
    username: ${PUBFLEET_DB_USER:pubfleet}
    password: ${PUBFLEET_DB_PASSWORD:pubfleet}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the mapping still matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${PUBFLEET_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: pubfleet-control-plane
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: dev.pubfleet.contracts
        spring.json.value.default.type: dev.pubfleet.contracts.JobCompletedEvent
        # The worker sends no type header. The default type above is the contract.
        spring.json.use.type.headers: false

server:
  port: ${PUBFLEET_CONTROL_PLANE_PORT:8081}

logging:
  level:
    dev.pubfleet: INFO
